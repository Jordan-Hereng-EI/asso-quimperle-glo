# Compose de PRODUCTION : utilise les images publiées sur GHCR par les
# GitHub Actions. Ce fichier est copié sur le VPS (dans /opt/quimperle-glo,
# sous le nom docker-compose.yml) automatiquement à chaque déploiement.
#
# Les variables viennent du fichier .env écrit à côté par le déploiement
# (lui-même alimenté par les secrets GitHub) — voir .env.example.
#
# Logs : chaque service écrit dans le journal système du VPS (driver journald)
# plutôt que dans des fichiers propres au conteneur. L'historique survit donc
# aux redéploiements et se consulte avec `journalctl CONTAINER_TAG=<tag>` ou
# dans Dozzle (port 8080). Voir README, section « Logs ».

x-journald: &journald
  driver: journald

services:
  site:
    image: ghcr.io/jordan-hereng-ei/asso-quimperle-glo-site:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-quimperle}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquante}@db:5432/${POSTGRES_DB:-quimperle_glo}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads:ro
    depends_on:
      db:
        condition: service_healthy
    logging:
      <<: *journald
      options:
        tag: site

  admin:
    image: ghcr.io/jordan-hereng-ei/asso-quimperle-glo-admin:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET manquante}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL manquante}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH manquante}
      DATABASE_URL: postgresql://${POSTGRES_USER:-quimperle}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquante}@db:5432/${POSTGRES_DB:-quimperle_glo}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    logging:
      <<: *journald
      options:
        tag: admin

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quimperle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquante}
      POSTGRES_DB: ${POSTGRES_DB:-quimperle_glo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      <<: *journald
      options:
        tag: db

  # Consultation des logs dans le navigateur (temps réel, recherche, filtres),
  # réservée au développeur : compte défini par dozzle/users.yml, écrit par le
  # déploiement depuis le secret GitHub DOZZLE_USERS_YML. Lecture seule du
  # socket Docker, aucune donnée stockée par Dozzle lui-même.
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle/users.yml:/data/users.yml:ro
    logging:
      <<: *journald
      options:
        tag: dozzle

volumes:
  pgdata:
  # Photos uploadées depuis l'admin (écriture) et servies par le site (lecture).
  # Persistant entre les déploiements ; à inclure dans les sauvegardes du VPS
  # avec pgdata.
  uploads:
