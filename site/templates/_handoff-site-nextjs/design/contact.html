<!-- @dsCard group="Site" viewport="1280x760" name="Contact" subtitle="Formulaire, coordonnées et adhésion" -->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — Association Quimperlé-Glo</title>
    <link rel="stylesheet" href="../../styles.css" />
    <script src="../../_ds_bundle.js"></script>
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <script src="site-nav.js"></script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--paper);
        font-family: var(--font-body);
      }
      a {
        color: var(--benin-green-dark);
      }
      a:hover {
        color: var(--benin-green);
      }
      input,
      textarea,
      select {
        font-family: var(--font-body);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" src="Reveal.jsx"></script>
    <script type="text/babel" src="DonateModal.jsx"></script>
    <script type="text/babel" data-presets="react">
      const { NavBar, Footer, Button, Eyebrow, Badge, SectionHeading } =
        window.QuimperlGloDesignSystem_ce5208;
      const { Reveal, UPLOAD } = window;

      const SUJETS = [
        "Faire un don",
        "Parrainer un enfant",
        "Devenir bénévole",
        "Adhérer à l\u2019association",
        "Presse",
        "Autre demande",
      ];

      function Field({ label, children }) {
        return (
          <div style={{ display: "flex", flexDirection: "column", gap: "6px" }}>
            <label
              style={{
                fontSize: "0.8rem",
                fontWeight: 700,
                letterSpacing: "0.08em",
                textTransform: "uppercase",
                color: "var(--text-muted)",
              }}
            >
              {label}
            </label>
            {children}
          </div>
        );
      }

      function InfoRow({ tone, title, children, delay }) {
        const TONES = {
          green: "var(--benin-green)",
          yellow: "var(--benin-yellow-deep)",
          red: "var(--benin-red)",
        };
        return (
          <Reveal delay={delay}>
            <div style={{ display: "flex", gap: "16px", alignItems: "flex-start" }}>
              <span
                style={{
                  width: "12px",
                  height: "12px",
                  borderRadius: "50%",
                  background: TONES[tone],
                  marginTop: "6px",
                  flexShrink: 0,
                }}
              />
              <div>
                <div
                  style={{
                    fontFamily: "var(--font-display)",
                    fontWeight: 800,
                    fontSize: "1.05rem",
                    color: "var(--ink-900)",
                    letterSpacing: "-0.01em",
                  }}
                >
                  {title}
                </div>
                <p
                  style={{
                    margin: "4px 0 0",
                    fontSize: "0.98rem",
                    lineHeight: 1.6,
                    color: "var(--text-body)",
                  }}
                >
                  {children}
                </p>
              </div>
            </div>
          </Reveal>
        );
      }

      function Page() {
        const [donate, setDonate] = React.useState(false);
        const [sent, setSent] = React.useState(false);
        const [focus, setFocus] = React.useState(null);
        const field = (k) => ({
          width: "100%",
          boxSizing: "border-box",
          padding: "13px 16px",
          fontSize: "0.98rem",
          border: `1.5px solid ${focus === k ? "var(--benin-green)" : "var(--border-soft)"}`,
          borderRadius: "var(--radius-md)",
          background: "var(--white)",
          color: "var(--ink-900)",
          outline: "none",
          transition: "border-color 200ms, box-shadow 200ms",
          boxShadow: focus === k ? "0 0 0 3px rgba(0,149,67,0.12)" : "none",
        });
        return (
          <div>
            <NavBar
              logo="../../assets/logo.jpg"
              links={window.NAV_LINKS("contact")}
              onCta={() => setDonate(true)}
            />

            {/* Header band with image */}
            <header
              style={{ position: "relative", background: "var(--ink-900)", overflow: "hidden" }}
            >
              <img
                src={UPLOAD("Quimp-Glo-50 Didi+Fan club.JPG")}
                alt="Bénévoles et amis de l'association"
                style={{
                  position: "absolute",
                  inset: 0,
                  width: "100%",
                  height: "100%",
                  objectFit: "cover",
                  objectPosition: "center 32%",
                  opacity: 0.35,
                }}
              />
              <div
                style={{
                  position: "absolute",
                  inset: 0,
                  background: "linear-gradient(180deg, rgba(15,8,6,0.5), rgba(15,8,6,0.86))",
                }}
              />
              <div
                style={{
                  position: "relative",
                  maxWidth: "var(--container-narrow)",
                  margin: "0 auto",
                  padding: "clamp(64px, 9vw, 110px) clamp(20px, 5vw, 64px)",
                  textAlign: "center",
                }}
              >
                <Reveal>
                  <Eyebrow color="var(--benin-yellow)" ondark style={{ justifyContent: "center" }}>
                    Contact
                  </Eyebrow>
                </Reveal>
                <Reveal delay={140}>
                  <h1
                    style={{
                      margin: "18px 0 0",
                      fontFamily: "var(--font-display)",
                      fontSize: "clamp(2.2rem, 5.5vw, 3.6rem)",
                      fontWeight: 800,
                      lineHeight: 1.05,
                      letterSpacing: "-0.03em",
                      color: "var(--white)",
                    }}
                  >
                    Écrivez-nous, on vous{" "}
                    <span
                      style={{
                        fontFamily: "var(--font-script)",
                        fontWeight: 700,
                        color: "var(--benin-yellow)",
                      }}
                    >
                      répond
                    </span>
                  </h1>
                </Reveal>
                <Reveal delay={280}>
                  <p
                    style={{
                      margin: "18px auto 0",
                      maxWidth: "52ch",
                      fontSize: "1.08rem",
                      lineHeight: 1.65,
                      color: "var(--sand-200)",
                    }}
                  >
                    Don, parrainage, bénévolat ou simple question : l'équipe vous répond avec
                    plaisir, de Quimperlé au Bénin.
                  </p>
                </Reveal>
              </div>
              <div style={{ position: "relative", height: "6px", display: "flex" }}>
                <span style={{ flex: 1, background: "var(--benin-green)" }} />
                <span style={{ flex: 1, background: "var(--benin-yellow)" }} />
                <span style={{ flex: 1, background: "var(--benin-red)" }} />
              </div>
            </header>

            {/* Info + form */}
            <section
              style={{ background: "var(--surface-sunk)", padding: "var(--section-pad-y) 0" }}
            >
              <div
                style={{
                  maxWidth: "var(--container-max)",
                  margin: "0 auto",
                  padding: "0 clamp(20px, 5vw, 64px)",
                  display: "grid",
                  gridTemplateColumns: "repeat(auto-fit, minmax(320px, 1fr))",
                  gap: "clamp(36px, 6vw, 80px)",
                  alignItems: "start",
                }}
              >
                <div>
                  <Reveal>
                    <SectionHeading
                      eyebrow="Nous joindre"
                      title="Une association, deux"
                      scriptWord="rives"
                      lead="Basée à Quimperlé, dans le Finistère, l'association agit dans les villages de Glo au Bénin avec ses partenaires locaux."
                    />
                  </Reveal>
                  <div
                    style={{
                      display: "flex",
                      flexDirection: "column",
                      gap: "24px",
                      marginTop: "30px",
                    }}
                  >
                    <InfoRow tone="green" title="Adresse" delay={0}>
                      Association Quimperlé-Glo — Quimperlé, Finistère (29), Bretagne
                    </InfoRow>
                    <InfoRow tone="yellow" title="E-mail" delay={100}>
                      <a href="mailto:contact@quimperle-glo.fr">contact@quimperle-glo.fr</a>
                    </InfoRow>
                    <InfoRow tone="red" title="Permanences" delay={200}>
                      Lors des marchés solidaires et événements de l'association — annoncés sur
                      cette page et dans la presse locale.
                    </InfoRow>
                    <InfoRow tone="green" title="Au Bénin" delay={300}>
                      Nos partenaires locaux assurent le relais dans les villages de Glo
                      (Glo-Djigbé, Glo-Fanto…).
                    </InfoRow>
                  </div>
                  <Reveal delay={380}>
                    <div
                      style={{
                        marginTop: "34px",
                        position: "relative",
                        borderRadius: "var(--radius-lg)",
                        overflow: "hidden",
                        boxShadow: "var(--shadow-lg)",
                      }}
                    >
                      <img
                        src={UPLOAD("Equipe Bretonne Glo Sans Palu.jpg")}
                        alt="L'équipe bretonne en mission au Bénin"
                        style={{
                          width: "100%",
                          display: "block",
                          aspectRatio: "16/9",
                          objectFit: "cover",
                        }}
                      />
                      <div
                        style={{
                          position: "absolute",
                          left: 0,
                          right: 0,
                          bottom: 0,
                          padding: "14px 18px",
                          background: "linear-gradient(180deg, rgba(15,8,6,0), rgba(15,8,6,0.85))",
                          color: "var(--sand-100)",
                          fontSize: "0.88rem",
                        }}
                      >
                        L'équipe bretonne « Glo sans palu » en mission sur le terrain
                      </div>
                    </div>
                  </Reveal>
                </div>

                <Reveal delay={180}>
                  <div
                    style={{
                      background: "var(--white)",
                      borderRadius: "var(--radius-lg)",
                      boxShadow: "var(--shadow-lg)",
                      overflow: "hidden",
                    }}
                  >
                    <div style={{ height: "6px", display: "flex" }}>
                      <span style={{ flex: 1, background: "var(--benin-green)" }} />
                      <span style={{ flex: 1, background: "var(--benin-yellow)" }} />
                      <span style={{ flex: 1, background: "var(--benin-red)" }} />
                    </div>
                    <div style={{ padding: "clamp(28px, 4vw, 40px)" }}>
                      {sent ? (
                        <div style={{ textAlign: "center", padding: "26px 0" }}>
                          <div style={{ fontSize: "3rem" }}>💌</div>
                          <h3
                            style={{
                              fontFamily: "var(--font-display)",
                              fontSize: "1.5rem",
                              margin: "10px 0",
                              color: "var(--ink-900)",
                            }}
                          >
                            Message envoyé !
                          </h3>
                          <p
                            style={{
                              color: "var(--text-body)",
                              margin: "0 0 24px",
                              lineHeight: 1.6,
                            }}
                          >
                            Merci pour votre message. Un membre de l'équipe vous répondra très vite.
                          </p>
                          <Button variant="outline" onClick={() => setSent(false)}>
                            Écrire un autre message
                          </Button>
                        </div>
                      ) : (
                        <div style={{ display: "flex", flexDirection: "column", gap: "18px" }}>
                          <h3
                            style={{
                              fontFamily: "var(--font-display)",
                              fontSize: "1.5rem",
                              margin: 0,
                              color: "var(--ink-900)",
                              letterSpacing: "-0.02em",
                            }}
                          >
                            Envoyer un message
                          </h3>
                          <div
                            style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "16px" }}
                          >
                            <Field label="Nom">
                              <input
                                placeholder="Votre nom"
                                style={field("nom")}
                                onFocus={() => setFocus("nom")}
                                onBlur={() => setFocus(null)}
                              />
                            </Field>
                            <Field label="E-mail">
                              <input
                                type="email"
                                placeholder="vous@exemple.fr"
                                style={field("mail")}
                                onFocus={() => setFocus("mail")}
                                onBlur={() => setFocus(null)}
                              />
                            </Field>
                          </div>
                          <Field label="Sujet">
                            <select
                              style={{
                                ...field("sujet"),
                                appearance: "none",
                                backgroundImage:
                                  "linear-gradient(45deg, transparent 50%, var(--ink-600) 50%), linear-gradient(135deg, var(--ink-600) 50%, transparent 50%)",
                                backgroundPosition: "calc(100% - 20px) 50%, calc(100% - 15px) 50%",
                                backgroundSize: "5px 5px",
                                backgroundRepeat: "no-repeat",
                              }}
                              onFocus={() => setFocus("sujet")}
                              onBlur={() => setFocus(null)}
                            >
                              {SUJETS.map((s, i) => (
                                <option key={i}>{s}</option>
                              ))}
                            </select>
                          </Field>
                          <Field label="Message">
                            <textarea
                              rows="6"
                              placeholder="Bonjour, je souhaite…"
                              style={{ ...field("msg"), resize: "vertical" }}
                              onFocus={() => setFocus("msg")}
                              onBlur={() => setFocus(null)}
                            ></textarea>
                          </Field>
                          <Button variant="primary" size="lg" block onClick={() => setSent(true)}>
                            Envoyer le message
                          </Button>
                          <p
                            style={{
                              margin: 0,
                              fontSize: "0.82rem",
                              color: "var(--text-muted)",
                              textAlign: "center",
                            }}
                          >
                            Vos coordonnées ne servent qu'à vous répondre — jamais partagées.
                          </p>
                        </div>
                      )}
                    </div>
                  </div>
                </Reveal>
              </div>
            </section>

            {/* Donate band */}
            <section style={{ background: "var(--ink-900)" }}>
              <div style={{ height: "6px", display: "flex" }}>
                <span style={{ flex: 1, background: "var(--benin-green)" }} />
                <span style={{ flex: 1, background: "var(--benin-yellow)" }} />
                <span style={{ flex: 1, background: "var(--benin-red)" }} />
              </div>
              <div
                style={{
                  maxWidth: "var(--container-narrow)",
                  margin: "0 auto",
                  padding: "clamp(48px, 7vw, 80px) clamp(20px, 5vw, 64px)",
                  textAlign: "center",
                }}
              >
                <Reveal>
                  <h2
                    style={{
                      margin: 0,
                      fontFamily: "var(--font-display)",
                      fontSize: "clamp(1.7rem, 4vw, 2.5rem)",
                      fontWeight: 800,
                      letterSpacing: "-0.03em",
                      color: "var(--white)",
                    }}
                  >
                    Le plus court chemin pour aider : un{" "}
                    <span
                      style={{
                        fontFamily: "var(--font-script)",
                        fontWeight: 700,
                        color: "var(--benin-yellow)",
                      }}
                    >
                      don
                    </span>
                  </h2>
                </Reveal>
                <Reveal delay={160}>
                  <div style={{ marginTop: "28px" }}>
                    <Button variant="highlight" size="lg" onClick={() => setDonate(true)}>
                      Faire un don
                    </Button>
                  </div>
                </Reveal>
              </div>
            </section>

            <Footer logo="../../assets/logo.jpg" columns={window.FOOTER_COLS} />
            <window.DonateModal open={donate} onClose={() => setDonate(false)} />
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
    </script>
  </body>
</html>
