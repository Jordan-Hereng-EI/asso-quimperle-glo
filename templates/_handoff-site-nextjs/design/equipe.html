<!-- @dsCard group="Site" viewport="1280x760" name="L'équipe & espace membre" subtitle="Bureau, chiffres d'adhésion et connexion membre" -->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>L'équipe & espace membre — Association Quimperlé-Glo</title>
    <link rel="stylesheet" href="../../styles.css" />
    <script src="../../_ds_bundle.js"></script>
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <script src="site-nav.js"></script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--paper);
        font-family: var(--font-body);
      }
      a {
        color: var(--benin-green-dark);
      }
      a:hover {
        color: var(--benin-green);
      }
      input {
        font-family: var(--font-body);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" src="Reveal.jsx"></script>
    <script type="text/babel" src="DonateModal.jsx"></script>
    <script type="text/babel" data-presets="react">
      const { NavBar, Footer, Button, Eyebrow, Badge, SectionHeading, StatBlock } =
        window.QuimperlGloDesignSystem_ce5208;
      const { Reveal, UPLOAD } = window;

      const BUREAU = [
        { n: "Pélagie Atanhlouéto-Tritscher", r: "Présidente", tone: "green" },
        { n: "Yves Le Goff", r: "Vice-président", tone: "yellow" },
        { n: "Gwénaëlle Petit-Jean", r: "Secrétaire", tone: "red" },
        { n: "Katty Bardouil", r: "Secrétaire adjointe", tone: "green" },
        { n: "Christine Le Goff", r: "Trésorière", tone: "yellow" },
        { n: "Thomas Dinahet", r: "Communication", tone: "red" },
      ];
      const TONES = {
        green: "var(--benin-green)",
        yellow: "var(--benin-yellow-deep)",
        red: "var(--benin-red)",
      };
      const initials = (n) =>
        n
          .split(" ")
          .slice(0, 2)
          .map((w) => w[0])
          .join("");

      function MemberCard({ n, r, tone, delay }) {
        const [hov, setHov] = React.useState(false);
        return (
          <Reveal delay={delay}>
            <div
              onMouseEnter={() => setHov(true)}
              onMouseLeave={() => setHov(false)}
              style={{
                background: "var(--white)",
                borderRadius: "var(--radius-lg)",
                padding: "28px 24px",
                textAlign: "center",
                boxShadow: hov ? "var(--shadow-lg)" : "var(--shadow-sm)",
                transform: hov ? "translateY(-6px)" : "none",
                transition: "transform 320ms var(--ease-out), box-shadow 320ms var(--ease-out)",
                borderTop: `4px solid ${TONES[tone]}`,
              }}
            >
              <div
                style={{
                  width: "72px",
                  height: "72px",
                  margin: "0 auto 14px",
                  borderRadius: "50%",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  background: "var(--sand-100)",
                  color: "var(--ink-800)",
                  fontFamily: "var(--font-display)",
                  fontWeight: 800,
                  fontSize: "1.5rem",
                  letterSpacing: "0.02em",
                }}
              >
                {initials(n)}
              </div>
              <div
                style={{
                  fontFamily: "var(--font-display)",
                  fontWeight: 800,
                  fontSize: "1.08rem",
                  letterSpacing: "-0.01em",
                  color: "var(--ink-900)",
                  lineHeight: 1.25,
                }}
              >
                {n}
              </div>
              <div style={{ marginTop: "8px" }}>
                <Badge tone={tone} soft>
                  {r}
                </Badge>
              </div>
            </div>
          </Reveal>
        );
      }

      function Page() {
        const [donate, setDonate] = React.useState(false);
        const [sent, setSent] = React.useState(false);
        const field = {
          width: "100%",
          boxSizing: "border-box",
          padding: "13px 16px",
          fontSize: "0.95rem",
          border: "1.5px solid var(--border-soft)",
          borderRadius: "var(--radius-md)",
          background: "var(--white)",
          color: "var(--ink-900)",
          outline: "none",
          transition: "border-color 180ms",
        };
        return (
          <div>
            <NavBar
              logo="../../assets/logo.jpg"
              links={window.NAV_LINKS("equipe")}
              onCta={() => setDonate(true)}
            />

            {/* Header */}
            <header
              style={{ background: "var(--surface-sunk)", padding: "clamp(56px, 8vw, 96px) 0 0" }}
            >
              <div
                style={{
                  maxWidth: "var(--container-max)",
                  margin: "0 auto",
                  padding: "0 clamp(20px, 5vw, 64px)",
                }}
              >
                <Reveal>
                  <SectionHeading
                    eyebrow="L'équipe"
                    title="Celles et ceux qui font"
                    scriptWord="vivre l'association"
                    lead="Un bureau de six bénévoles épaulé par une vingtaine de membres actifs, en Bretagne comme au Bénin."
                    align="center"
                  />
                </Reveal>
                <div
                  style={{
                    display: "grid",
                    gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))",
                    gap: "clamp(16px, 2.5vw, 28px)",
                    margin: "clamp(36px, 5vw, 56px) 0",
                    maxWidth: "980px",
                    marginLeft: "auto",
                    marginRight: "auto",
                  }}
                >
                  {BUREAU.map((m, i) => (
                    <MemberCard key={i} {...m} delay={i * 90} />
                  ))}
                </div>
              </div>

              {/* Stats band */}
              <div style={{ background: "var(--ink-900)", marginTop: "clamp(24px, 4vw, 48px)" }}>
                <div style={{ height: "6px", display: "flex" }}>
                  <span style={{ flex: 1, background: "var(--benin-green)" }} />
                  <span style={{ flex: 1, background: "var(--benin-yellow)" }} />
                  <span style={{ flex: 1, background: "var(--benin-red)" }} />
                </div>
                <div
                  style={{
                    maxWidth: "var(--container-max)",
                    margin: "0 auto",
                    padding: "clamp(44px, 6vw, 72px) clamp(20px, 5vw, 64px)",
                    display: "grid",
                    gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))",
                    gap: "32px",
                  }}
                >
                  <Reveal delay={0}>
                    <StatBlock value="≈ 20" label="Membres actifs — une vingtaine" />
                  </Reveal>
                  <Reveal delay={140}>
                    <StatBlock
                      value="≈ 10"
                      label="Membres fondateurs — une dizaine"
                      color="var(--benin-green)"
                    />
                  </Reveal>
                  <Reveal delay={280}>
                    <StatBlock
                      value="≈ 100"
                      label="Membres adhérents — une centaine"
                      color="var(--benin-red)"
                    />
                  </Reveal>
                </div>
              </div>
            </header>

            {/* Espace membre */}
            <section style={{ background: "var(--paper)", padding: "var(--section-pad-y) 0" }}>
              <div
                style={{
                  maxWidth: "var(--container-max)",
                  margin: "0 auto",
                  padding: "0 clamp(20px, 5vw, 64px)",
                  display: "grid",
                  gridTemplateColumns: "repeat(auto-fit, minmax(320px, 1fr))",
                  gap: "clamp(36px, 6vw, 80px)",
                  alignItems: "center",
                }}
              >
                <div>
                  <Reveal>
                    <SectionHeading
                      eyebrow="Espace membre"
                      title="Un espace réservé aux"
                      scriptWord="adhérents"
                      lead="Comptes rendus de réunions, photos des missions, suivi des parrainages et documents de l'association : connectez-vous avec vos identifiants d'adhérent."
                    />
                  </Reveal>
                  <Reveal delay={160}>
                    <div
                      style={{
                        display: "flex",
                        flexDirection: "column",
                        gap: "14px",
                        marginTop: "26px",
                      }}
                    >
                      {[
                        ["green", "Comptes rendus et convocations aux assemblées"],
                        ["yellow", "Photos et nouvelles des enfants parrainés"],
                        ["red", "Reçus fiscaux et attestations de dons"],
                      ].map(([t, d], i) => (
                        <div key={i} style={{ display: "flex", gap: "12px", alignItems: "center" }}>
                          <span
                            style={{
                              width: "10px",
                              height: "10px",
                              borderRadius: "50%",
                              background: TONES[t],
                              flexShrink: 0,
                            }}
                          />
                          <p style={{ margin: 0, fontSize: "1rem", color: "var(--text-body)" }}>
                            {d}
                          </p>
                        </div>
                      ))}
                    </div>
                  </Reveal>
                </div>
                <Reveal delay={200}>
                  <div
                    style={{
                      maxWidth: "420px",
                      justifySelf: "center",
                      width: "100%",
                      background: "var(--white)",
                      borderRadius: "var(--radius-lg)",
                      boxShadow: "var(--shadow-lg)",
                      overflow: "hidden",
                    }}
                  >
                    <div style={{ height: "6px", display: "flex" }}>
                      <span style={{ flex: 1, background: "var(--benin-green)" }} />
                      <span style={{ flex: 1, background: "var(--benin-yellow)" }} />
                      <span style={{ flex: 1, background: "var(--benin-red)" }} />
                    </div>
                    <div style={{ padding: "34px" }}>
                      {sent ? (
                        <div style={{ textAlign: "center", padding: "18px 0" }}>
                          <div style={{ fontSize: "2.6rem" }}>🔑</div>
                          <h3
                            style={{
                              fontFamily: "var(--font-display)",
                              fontSize: "1.4rem",
                              margin: "8px 0",
                              color: "var(--ink-900)",
                            }}
                          >
                            Maquette
                          </h3>
                          <p style={{ color: "var(--text-body)", margin: "0 0 20px" }}>
                            La connexion sera activée avec le site final.
                          </p>
                          <Button variant="outline" block onClick={() => setSent(false)}>
                            Retour
                          </Button>
                        </div>
                      ) : (
                        <div>
                          <h3
                            style={{
                              fontFamily: "var(--font-display)",
                              fontSize: "1.45rem",
                              margin: "0 0 4px",
                              color: "var(--ink-900)",
                              letterSpacing: "-0.02em",
                            }}
                          >
                            Connexion membre
                          </h3>
                          <p
                            style={{
                              color: "var(--text-muted)",
                              margin: "0 0 22px",
                              fontSize: "0.92rem",
                            }}
                          >
                            Identifiants remis lors de l'adhésion.
                          </p>
                          <label
                            style={{
                              display: "block",
                              fontSize: "0.8rem",
                              fontWeight: 700,
                              letterSpacing: "0.08em",
                              textTransform: "uppercase",
                              color: "var(--text-muted)",
                              marginBottom: "6px",
                            }}
                          >
                            E-mail
                          </label>
                          <input
                            type="email"
                            placeholder="vous@exemple.fr"
                            style={{ ...field, marginBottom: "16px" }}
                            onFocus={(e) => (e.target.style.borderColor = "var(--benin-green)")}
                            onBlur={(e) => (e.target.style.borderColor = "var(--border-soft)")}
                          />
                          <label
                            style={{
                              display: "block",
                              fontSize: "0.8rem",
                              fontWeight: 700,
                              letterSpacing: "0.08em",
                              textTransform: "uppercase",
                              color: "var(--text-muted)",
                              marginBottom: "6px",
                            }}
                          >
                            Mot de passe
                          </label>
                          <input
                            type="password"
                            placeholder="••••••••"
                            style={{ ...field, marginBottom: "22px" }}
                            onFocus={(e) => (e.target.style.borderColor = "var(--benin-green)")}
                            onBlur={(e) => (e.target.style.borderColor = "var(--border-soft)")}
                          />
                          <Button variant="primary" block size="lg" onClick={() => setSent(true)}>
                            Se connecter
                          </Button>
                          <p
                            style={{
                              margin: "16px 0 0",
                              fontSize: "0.85rem",
                              color: "var(--text-muted)",
                              textAlign: "center",
                            }}
                          >
                            Pas encore adhérent ? <a href="contact.html">Contactez-nous</a>
                          </p>
                        </div>
                      )}
                    </div>
                  </div>
                </Reveal>
              </div>
            </section>

            {/* Team photo closing */}
            <section
              style={{ position: "relative", background: "var(--ink-900)", overflow: "hidden" }}
            >
              <img
                src={UPLOAD("Quimp-Glo-119 Bretagne Bénin.JPG")}
                alt="Soirée Bretagne-Bénin"
                style={{
                  position: "absolute",
                  inset: 0,
                  width: "100%",
                  height: "100%",
                  objectFit: "cover",
                  opacity: 0.3,
                }}
              />
              <div
                style={{
                  position: "relative",
                  maxWidth: "var(--container-narrow)",
                  margin: "0 auto",
                  padding: "clamp(56px, 8vw, 90px) clamp(20px, 5vw, 64px)",
                  textAlign: "center",
                }}
              >
                <Reveal>
                  <h2
                    style={{
                      margin: 0,
                      fontFamily: "var(--font-display)",
                      fontSize: "clamp(1.8rem, 4vw, 2.6rem)",
                      fontWeight: 800,
                      letterSpacing: "-0.03em",
                      color: "var(--white)",
                    }}
                  >
                    Envie de nous{" "}
                    <span
                      style={{
                        fontFamily: "var(--font-script)",
                        fontWeight: 700,
                        color: "var(--benin-yellow)",
                      }}
                    >
                      rejoindre
                    </span>{" "}
                    ?
                  </h2>
                </Reveal>
                <Reveal delay={160}>
                  <div
                    style={{
                      display: "flex",
                      gap: "14px",
                      justifyContent: "center",
                      flexWrap: "wrap",
                      marginTop: "28px",
                    }}
                  >
                    <Button
                      variant="highlight"
                      size="lg"
                      onClick={() => (window.location.href = "contact.html")}
                    >
                      Devenir bénévole
                    </Button>
                    <Button
                      variant="ghost"
                      size="lg"
                      style={{ color: "var(--white)" }}
                      onClick={() => setDonate(true)}
                    >
                      Faire un don
                    </Button>
                  </div>
                </Reveal>
              </div>
            </section>

            <Footer logo="../../assets/logo.jpg" columns={window.FOOTER_COLS} />
            <window.DonateModal open={donate} onClose={() => setDonate(false)} />
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
    </script>
  </body>
</html>
