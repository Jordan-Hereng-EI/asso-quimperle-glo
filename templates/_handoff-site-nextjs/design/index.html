  <body>
    <div id="root"></div>
    <script type="text/babel" src="Hero.jsx"></script>
    <script type="text/babel" src="Reveal.jsx"></script>
    <script type="text/babel" src="DonateModal.jsx"></script>
    <script type="text/babel" src="ExtraSections.jsx"></script>
    <script type="text/babel" src="MissionsSection.jsx"></script>
    <script type="text/babel" src="AboutSection.jsx"></script>
    <script type="text/babel" data-presets="react">
      const { NavBar, Footer, Button } = window.QuimperlGloDesignSystem_ce5208;
      const DonateModal = window.DonateModal;

      function App() {
        const [scrolled, setScrolled] = React.useState(false);
        const [donate, setDonate] = React.useState(false);
        React.useEffect(() => {
          const el = document.getElementById("scrollhost");
          const onScroll = () => setScrolled((el ? el.scrollTop : window.scrollY) > 40);
          const target = el || window;
          target.addEventListener("scroll", onScroll);
          return () => target.removeEventListener("scroll", onScroll);
        }, []);
        const open = () => setDonate(true);
        return (
          <div id="scrollhost" style={{ height: "100vh", overflowY: "auto" }}>
            <div style={{ position: "sticky", top: 0, zIndex: 50 }}>
              <NavBar
                logo="../../assets/logo.jpg"
                links={window.NAV_LINKS("accueil")}
                transparent
                scrolled={scrolled}
                onCta={open}
              />
            </div>
            <div style={{ marginTop: "-82px" }}>
              <window.Hero onDonate={open} />
            </div>
            <window.MissionsSection />
            <window.PhotoMarquee />
            <window.AboutSection />
            <window.PresidentTeaser />
            <window.DonateBand onDonate={open} />
            <Footer logo="../../assets/logo.jpg" columns={window.FOOTER_COLS} />
            <DonateModal open={donate} onClose={() => setDonate(false)} />
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
